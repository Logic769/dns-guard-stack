# AGH 管理面板 · nginx TLS 前置（2026-10-05，应业主"需要经界面管理"的需求而开放公网）
# 安全边界：
#   · AGH 自身仍只监听 127.0.0.1:3000（容器的 3000 发布为回环），公网只能经本 vhost 进入；
#   · 传输全程 TLS（复用 dns.example.com 的 Let's Encrypt 证书），不再是明文 HTTP；
#   · limit_req 限速 + AGH 自身 auth_attempts=5/block_auth_min=15 双重防爆破。
# 回滚：删除本文件 + nginx -s reload。
limit_req_zone $binary_remote_addr zone=adg_admin:10m rate=30r/s;

server {
    listen 8443 ssl;
    http2 on;
    server_name dns.example.com;

    ssl_certificate     /www/server/panel/vhost/cert/dns.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dns.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL-ADG:5m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /www/wwwlogs/adg-admin.log;
    error_log  /www/wwwlogs/adg-admin.error.log;

    client_max_body_size 16m;
    client_body_buffer_size 128k;

    location / {
        limit_req zone=adg_admin burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
