# DoH 设备指纹日志格式（devfp 看板用）—— 由 /devices/ 看板消费
# 放在 http 作用域（本文件被 /www/server/panel/vhost/nginx/*.conf 这个 http 级 include 加载）
# 注意：nginx 按文件名排序加载，本文件必须排在引用 dohfrag 的 vhost 之前（0.* < 9.*）。
#
# 字段顺序必须与 /opt/devfp/devfp.py 的 doh_parse() 一致（共 30 个字段）：
#   [0]time_iso8601 [1]remote_addr [2]x_forwarded_for [3]method [4]uri
#   [5]server_protocol [6]status [7]body_bytes_sent [8]request_time
#   [9]ssl_protocol [10]ssl_cipher [11]ssl_ciphers [12]ssl_curves [13]ssl_alpn_protocol
#   [14]ssl_session_reused [15]ssl_server_name [16]http_accept [17]http_accept_language
#   [18]http_accept_encoding [19]http_content_type [20]http_dnt [21]http_priority
#   [22]http_te [23]http_host [24]arg_dns(GET 的 base64url 查询名)
#   [25]sec_ch_ua_model [26]sec_ch_ua_platform_version [27]sec_ch_ua_full_version_list
#   [28]http_user_agent [29]request_body(POST 的 DNS 明文，放最后：里面可能带 '|')
log_format dohfrag '$time_iso8601|$remote_addr|$http_x_forwarded_for|$request_method|$uri|$server_protocol|$status|$body_bytes_sent|$request_time|$ssl_protocol|$ssl_cipher|$ssl_ciphers|$ssl_curves|$ssl_alpn_protocol|$ssl_session_reused|$ssl_server_name|$http_accept|$http_accept_language|$http_accept_encoding|$http_content_type|$http_dnt|$http_priority|$http_te|$http_host|$arg_dns|$http_sec_ch_ua_model|$http_sec_ch_ua_platform_version|$http_sec_ch_ua_full_version_list|$http_user_agent|$request_body';
