# 设备指纹看板 —— 由 devfp.service(127.0.0.1:8789) 提供数据
# 访问 https://dns.example.com/devices/  （Basic Auth，复用 /chain/ 的账号）
location = /devices {
    return 301 /devices/;
}

# 家庭侧 agent 推送入口：不能用 Basic Auth（路由器上没有面板密码），
# 改由应用层校验 X-Devfp-Token（无效直接 401）。精确匹配优先于下面的 ^~ 前缀。
location = /devices/api/router/raw {
    auth_basic off;
    proxy_pass http://127.0.0.1:8789/api/router/raw;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
    proxy_read_timeout 60s;
}

location = /devices/api/router {
    auth_basic off;
    proxy_pass http://127.0.0.1:8789/api/router;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
    proxy_read_timeout 60s;
}

location ^~ /devices/ {
    auth_basic "device fingerprint dashboard";
    auth_basic_user_file /www/server/nginx/conf/chainmon.htpasswd;

    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}
