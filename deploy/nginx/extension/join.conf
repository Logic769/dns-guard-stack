# 独立登记页（/join）—— 免密只读面 + 唯一一个受约束的写接口
# 2026-10-05 新增。设计要点（网络/凭据/安全三方评审收敛）：
#   ① 只用**精确匹配**（location = ），优先级最高，物理上不可能影响 ^~ /devices/ 与 ^~ /chain/ 的认证
#   ② 认证面 100% 不动：本文件只新增 4 个精确路径，删掉本文件 + reload 即完全回滚
#   ③ 写路径四道闸门：client_max_body_size 32k + limit_conn + 应用层每 IP 6 次/分 + 字段白名单
#   ⑤ 2026-10-15：/join 与 /join/ 下发 Accept-CH（高熵 UA-CH 只在"下一次请求"才带，需服务端索要）；
#      请求体 8k→32k（全量指纹 fp2 约 6–12KB）。CSP 不动：脚本仍是内联、外链仍只放 *.dns.example.com。
#   ④ 响应加最小 CSP（default-src 'none'）：本页无第三方依赖，任何外链都被浏览器拒绝
# 回滚：rm 本文件 && nginx -t && nginx -s reload

location = /join {
    auth_basic off;
    limit_conn perip 5;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8789/join;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    add_header Accept-CH "Sec-CH-UA-Full-Version-List, Sec-CH-UA-Platform-Version, Sec-CH-UA-Arch, Sec-CH-UA-Bitness, Sec-CH-UA-Model, Sec-CH-UA-WoW64, Sec-CH-UA-Form-Factors, Sec-CH-Device-Memory, Sec-CH-Prefers-Color-Scheme, Sec-CH-Prefers-Reduced-Motion, Sec-CH-Viewport-Width, Sec-CH-Viewport-Height" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://*.dns.example.com; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
}

location = /join/ {
    auth_basic off;
    limit_conn perip 5;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8789/join;
    proxy_http_version 1.1;
