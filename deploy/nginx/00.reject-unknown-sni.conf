# 目标3核心加固：443 上 IP 直连 / 未知 SNI 的握手一律拒绝，不返回任何证书
# 依据：nginx 源码 ngx_http_ssl_module.c:1489-1540 —— reject_handshake 时不要求 ssl_certificate
# 影响：默认 443 server 不再是 127.0.0.1.conf，扫描器无法用 IP 反问出 dns.example.com
# 回滚：删除本文件后 nginx -t && nginx -s reload
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
}
