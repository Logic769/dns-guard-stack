# §3.1 入口容量（2026-10-15）：DoT 连接限额 —— 每源 IP 并发 + 全端口并发
limit_conn_zone $binary_remote_addr zone=dot_perip:10m;
limit_conn_zone $server_port zone=dot_total:1m;

# DoT 853: Nginx stream TLS terminator -> encrypted TLS proxy to AdGuard Home 8854.
server {
    listen 853 ssl;
    # §3.1 入口容量：每源 IP 32 并发 / 全端口 512 并发（超出直接拒绝连接，保护 guard/AGH/宿主）
    limit_conn dot_perip 32;
    limit_conn dot_total 512;

    # 固定票密钥：让 TLS1.3 会话票跨 worker/reload/重启保持可解密（devfp 的 psk_ident 关联依赖它）
    ssl_session_tickets     on;
    ssl_session_ticket_key  /www/server/nginx/conf/session_keys/dot853.ticket;
    # 内腿改为明文 DNS（docker 网桥 172.18.0.2:53）：让 dotfront-spool 能看到 EDNS/COOKIE/PADDING
    proxy_pass 172.18.0.2:53;

    ssl_certificate     /www/server/panel/vhost/cert/dns.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dns.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dot_853:4m;
    ssl_session_timeout 10m;

#     proxy_ssl on;
#     proxy_ssl_server_name on;
#     proxy_ssl_name dns.example.com;
#     proxy_ssl_protocols TLSv1.2 TLSv1.3;
#     proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
#     proxy_ssl_verify on;
#     proxy_ssl_verify_depth 3;
    proxy_connect_timeout 5s;
    proxy_timeout 30s;
}
