limit_req_zone $binary_remote_addr zone=doh_req:10m rate=200r/s;

# [perf-tune 20261017] DoH 上游：直连 AGH 容器（绕 docker-proxy）+ HTTP/1.1 keepalive
# 回滚：删本块并把 proxy_pass 改回 https://127.0.0.1:4443
upstream agh_doh {
    # 2026-10-23：18444 从未被 dnsdist 监听（持续 502 22 小时）。dnsdist 的 DoH 只认 HTTP/2，
    # 而本机 nginx 到上游是 HTTP/1.1（proxy_http_version 2 不生效，实测 dnsdist 返 400），
    # 故改为 nginx → AGH 容器 443（宿主 127.0.0.1:4443），两端都支持 h1.1/h2。
    # 回滚：改回 127.0.0.1:18444 或 server 172.18.0.2:443（AGH 直连）
    server 127.0.0.1:4443;
    keepalive 128;
    keepalive_timeout 60s;
}

# DoH :444 —— 由 nginx 终结 TLS 后反代到 AGH（容器 adgh 的 443，宿主回环 127.0.0.1:4443）
#
# 为什么这么改：AGH 自己终结 TLS 时看不到 HTTP 层（User-Agent/请求头/URL 里的查询域名），
# 而 DoH 客户端的「逐设备域名归属」只能从这里拿。改后：
#   DoH 客户端 --TLS--> nginx:444 --TLS--> 127.0.0.1:4443 (AGH)，并用 X-Forwarded-For 传真实客户端 IP
#   AGH 的 trusted_proxies 已含 172.18.0.0/16（docker 网关），所以 querylog 里记的是真实客户端 IP。
# 回滚：删掉本文件 + 把 dns.example.com.conf 里的 4443 改回 444 + 容器改回 `-p 444:443`。
server {
    # 2026-10-22：444 已移交 dnsdist，nginx 不再监听
    # listen 444 ssl;
    http2 on;

    server_name dns.example.com;

    ssl_certificate    /www/server/panel/vhost/cert/dns.example.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/dns.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!3DES:!RC4:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL-DoH:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    client_body_buffer_size 64k;

    access_log /www/wwwlogs/doh-devices.log dohfrag;
    error_log /www/wwwlogs/doh-444.error.log;

    # 【2026-10-05 收紧】AGH 的 443 监听同时提供 DoH 与管理面板，原 `location /`
    # 会把 AGH 管理面板(/login.html、/control/*、/api/*)一并透出到公网 DoH 端口，
    # 且该端口已被互联网扫描器探测。实测 AGH 只在 /dns-query 提供 DoH（其它路径 401），
    # 真实流量 51225/51446 全部为 /dns-query，故精确放行即可，不影响任何客户端。
    # Accept-CH：若对面是浏览器栈，它会回报 Sec-CH-UA-Model（= 型号）等高熵提示
    location = /dns-query {
        # §3.1 入口容量：每源 IP 32 并发 + 50 r/s（burst 100）
        limit_conn perip 32;
        limit_req zone=doh_req burst=200 nodelay;
        add_header Accept-CH "Sec-CH-UA-Model, Sec-CH-UA-Platform-Version, Sec-CH-UA-Full-Version-List, Sec-CH-UA-Arch" always;
        proxy_pass https://agh_doh;
        proxy_ssl_session_reuse on;
        proxy_next_upstream error timeout;
        proxy_ssl_server_name on;
        proxy_ssl_name dns.example.com;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_http_version 2;   # 2026-10-22：dnsdist DoH 强制 HTTP/2（RFC 8484 §5.2）
        proxy_set_header Host dns.example.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_cache off;
        proxy_buffering off;
    }

    # 其它一切路径一律拒绝：消除管理面板与扫描面（AGH 在非 /dns-query 路径本就返回 401）
    location / {
        return 404;
    }
}
