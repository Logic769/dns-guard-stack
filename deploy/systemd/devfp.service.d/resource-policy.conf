[Service]
# 2026-10-10 还原：本文件在 P34-BF 中被 `systemctl revert devfp` 误删 ✗
# 原值依据：事故前 `systemctl show devfp` 实测 MemoryHigh=100663296(96MiB) / MemoryMax=167772160(160MiB) ✓
#         且方案任务6 明确要求"先保持 MemoryMax 160MiB" ✓。
MemoryHigh=96M
MemoryMax=160M

# 2026-10-10 Task 7：devfp 是唯一未禁换出的服务（VmRSS 17MB 却换出 ~60MB、maj_flt 27/s）
MemorySwapMax=0

# 2026-10-10 Task 7：cgroup v1 下 MemorySwapMax=0 不足以把 memsw.limit 收到 limit；
# 本脚本把 memory.memsw.limit_in_bytes 设成与 memory.limit_in_bytes 相等（=真正禁换出）。
# 与 chainmon / dnsguard / dnscrypt-proxy-local 的既有做法一致 ✓
ExecStartPost=/usr/local/sbin/set-service-memory-swappiness.sh %n
