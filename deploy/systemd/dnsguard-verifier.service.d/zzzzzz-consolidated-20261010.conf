# ============================================================================
# dnsguard-verifier 单一收敛 drop-in（Task 8，2026-10-10）
# 注意：基础单元 dnsguard-verifier.service **本身**带 7 条 Environment，
# 合并后需把它们从基础单元移除（本文件承载全部值），否则仍属"两处定义"。
# 合并前重复定义：GUARD_UPSTREAM_WORKERS 8（基础单元） -> 16（zzzz-latency-canary.conf）
# ============================================================================
[Service]

# --- Environment（含原先写在基础单元里的 7 条）---
Environment=GUARD_DISABLE_MULLVAD=1
Environment=GUARD_MAX_INFLIGHT=32
Environment=GUARD_MAX_PENDING=64
Environment=GUARD_COLD_MAX=16
Environment=GUARD_LISTEN_HOST=127.0.0.1
Environment=GUARD_PORT=0
Environment=GUARD_UPSTREAM_WORKERS=16
Environment=GUARD_STATE_DIR=/opt/dnsguard/verifier-state
Environment=VERIFIER_SLOTS=40
Environment=VERIFIER_R3_SLOTS=16
Environment=VERIFIER_CORROB_SLOTS=8
Environment=VERIFIER_STRICT_SLOTS=8
Environment=VERIFIER_TIMEOUT_CAP=3.8
Environment=GUARD_R8_WORKERS=18
Environment=GUARD_FAST_UDP=127.0.0.2:5353
Environment=GUARD_CORROB_TTL=300

# --- 资源 ---（基础单元 dnsguard-verifier.service 已声明 MemoryMax=128M/TasksMax=128，此处显式重申以便单一来源）
MemoryMax=128M
MemoryHigh=100M
MemorySwapMax=0
TasksMax=128
# Task 7：cgroup v1 下还需把 memsw.limit 收到 limit（否则仍可换出）
ExecStartPost=-/usr/local/sbin/set-service-memory-swappiness.sh %n

# --- 发布目录 ---
ExecStart=
ExecStart=/usr/bin/python3 /opt/dnsguard/current/verifier.py
WorkingDirectory=/opt/dnsguard/current
