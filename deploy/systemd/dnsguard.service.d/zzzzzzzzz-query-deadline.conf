# P1（2026-10-22）：总查询预算 4.0s -> 3.0s
# 现场依据（querylog 20000 条实测）：
#   >2s 请求 58 条，其中 12 条是**有答案的正常域名**(163/baidu/trae) ⇒ AGH 超时不能收紧；
#   >3s 请求 16 条，**全部是空答案**（15 条死链 + 1 条 zz13.yirujs.com）⇒ 收紧到 3s 零误杀。
# 收益：死链冷路径天花板从 3852ms 降到 ~3000ms，且不再空耗 alt 预算。
# 风险：低——只影响本就要失败的那 0.95%。
# 回滚：删本文件 + daemon-reload + restart dnsguard。
[Service]
Environment=GUARD_QUERY_DEADLINE=3.0
