# P2（2026-10-22）：失败域名负缓存自适应退避 —— 正式配置
# 现场依据：死链域名在 15s 负缓存未命中时重走 unbound A(872ms)+fastpass(711ms) 全链路，
#   客户端可见 1202~3222ms；重访间隔实测 300s（客户端 58.17.41.98 每 5 分钟一轮）。
# 机制：连续失败指数退避 15/30/60/120/240/480/900（封顶 900s）。
# ★ 2026-10-22 方案B：TTL_MAX 300 -> 900
#   动机：300s 恰好等于重访间隔 300s，边界抖动必然错过（实测命中率仅 13%）。
#        900s = 3 倍余量，可覆盖 2 个完整周期。
#   代价（用户已知悉并选择）：域名恢复后最长 900s（15 分钟）才被重新验证。
#   配套：guard.py 的指数上限已由固定 2**5 改为按 TTL_MAX 反推，否则 900 不生效。
# 回滚：改回 GUARD_SF_TTL_MAX=300 + daemon-reload + restart dnsguard。
[Service]
Environment=GUARD_SF_BACKOFF=1
Environment=GUARD_SF_TTL_MIN=15
Environment=GUARD_SF_TTL_MAX=900
