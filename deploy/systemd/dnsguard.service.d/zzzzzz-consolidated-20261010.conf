# ============================================================================
# dnsguard 单一收敛 drop-in（Task 8，2026-10-10）
# 由 9 个 drop-in 合并而成，**每个参数只在此定义一次**，值是合并前
# `systemctl show dnsguard -p Environment -p MemoryMax -p MemoryHigh` 的最终生效值。
# 归档原件：/root/task8-stage/archive-dnsguard-dropins/
# 应用：systemctl daemon-reload && systemctl restart dnsguard dnsguard-verifier
# 回滚：rm 本文件 + 恢复归档 drop-in + daemon-reload + restart
# ----------------------------------------------------------------------------
# 合并前存在重复定义（后者胜出）：
#   GUARD_MAX_INFLIGHT  32 -> 96     (zz-gate.conf)
#   GUARD_MAX_PENDING   48 -> 96     (zz-gate.conf)
#   GUARD_CORROB_TTL   600 -> 3600   (zzzz-latency-canary.conf)
#   MemoryMax          128M -> 192M  (zz-gate.conf)
#   MemoryHigh          96M -> 160M  (zz-gate.conf)
#   ExecStart/WorkingDirectory（基础单元 -> zzzzz-release.conf）
# ============================================================================
[Service]

# --- Environment：每个键仅此一处定义 ---
Environment=GUARD_CORROB_TTL=300
Environment=GUARD_DOMESTIC_DO=1
Environment=GUARD_MAX_INFLIGHT=96
Environment=GUARD_MAX_PENDING=96
Environment=GUARD_UPSTREAM_WORKERS=16
Environment=GUARD_COLD_MAX=48
Environment=GUARD_LISTEN_HOST=172.18.0.1
# 2026-10-19：DoQ2 重新启用（aghdq2 -> Quad9 dns10，独立运营方，非 NextDNS）。
# 启用前提已逐条验证：
#   1) 不增加首轮延迟：doq2 位于 _dot_query_once 的 slow 列表，只在 HEDGE_MS 之后
#      才并发启动；实测 hedge 时点 = max(160,min(420, doq_rtt*1.2+40)) ≈ 370ms，
#      而 doq2 冷查询 p50=243ms，远快于它替代的 DoT（实测 1095ms）。
#   2) 不增加投毒风险：Quad9 dns10 做 DNSSEC 校验（dnssec-failed.org 返回 SERVFAIL），
#      且运营方与 NextDNS 完全独立 —— guard 的"s2 家不同运营方"判据因此才有第二家可选。
#   3) aghdq2 侧已修三处风险：cache_optimistic=false、cache_ttl_min=0、
#      bootstrap 改独立公网 223.5.5.5/223.6.6.6（原指向 unbound A，aghdq 挂时无法 bootstrap）。
# 回滚：把本行改回 Environment=GUARD_DISABLE_DOQ2=1 + daemon-reload + restart dnsguard
Environment=GUARD_DISABLE_DOQ2=0
# 2026-10-19：第三条干净通道 aghcf（AGH 容器，上游 tls://1.1.1.1，本机 127.0.0.1:5535）。
# 启用前提已逐条验证：
#   1) 延迟：冷查询 p50≈83ms，DoQ1(NextDNS)≈270ms、DoQ2(Quad9)≈240ms ⇒ 进 fast 首轮并发，
#      谁先返回用谁，只可能更快。
#   2) 投毒风险：1.1.1.1 做 DNSSEC 校验（dnssec-failed.org → SERVFAIL rcode=2）；
#      运营方 Cloudflare 与 NextDNS/Quad9 均不同 ⇒ 提高而非削弱独立性。
#   3) 传输：DoT 裸 IP（1.1.1.1 证书 SAN 含该 IP），不发 SNI ⇒ 天然绕过按 SNI 的干扰；
#      **绝不使用 UDP53**（实测 UDP53 对 1.1.1.1 被污染，google/youtube/wikipedia 全返回
#      Facebook/Twitter 的地址）。
#   4) CN 域名不受影响：guard 对 CN 域名用 targets_override=CN_DOT 核对 + 国内源采纳，
#      A 通道的 clean 答案不直接成为 CN 终局答案（已实测验证）。
# 回滚：删除下面这行 GUARD_DOQ3_ENABLE=1 + daemon-reload + restart，或 aghcf 容器停掉即可。
Environment=GUARD_DOQ3_ENABLE=1
Environment=GUARD_CORROB_STRICT_NODATA=1
Environment=GUARD_HEDGE_MS=280
Environment=GUARD_SYNC_BUDGET=3.8
Environment=GUARD_CORROB_DOT_TIMEOUT=1.8
Environment=GUARD_CORROB_STRICT_FAIL_CLOSED=0
Environment=GUARD_VERIFIER_SOCKET=/run/dnsguard/verifier.sock
Environment=GUARD_MAX_QUEUE=16
Environment=GUARD_QUERY_DEADLINE=4.0
Environment=GUARD_R8_ASN_GATE=1
Environment=GUARD_R8_AUDIT=1
Environment=GUARD_R8_AUDIT_PCT=10
Environment=GUARD_CN_EXIST_MODE=enforce
Environment=GUARD_CN_VETO_WITNESS=127.0.0.1:5535
Environment=GUARD_OVERLOAD_RCODE=5
Environment=GUARD_OVERLOAD_EDE=22
Environment=GUARD_FAST_UDP=127.0.0.2:5353
Environment=GUARD_SHADOW_DNSCRYPT=127.0.0.2:5353
Environment=GUARD_SHADOW_PCT=10
Environment=GUARD_POLICY_MODE=on
Environment=GUARD_HOT_REFRESH=1

# --- 资源与优先级 ---
ExecStartPost=/usr/local/sbin/set-service-memory-swappiness.sh %n
MemorySwapMax=0
MemoryHigh=160M
MemoryMax=192M
TasksMax=512
OOMScoreAdjust=-200
Nice=-2

# --- 发布目录（先清空再赋值，systemd 语义）---
ExecStart=
ExecStart=/usr/bin/python3 /opt/dnsguard/current/guard.py
WorkingDirectory=/opt/dnsguard/current

# ── §6（2026-10-11）：CN 域名国内认证加密源晋升 ──────────────────────────
# 依据：360 dot.360.cn 是国内唯一可支撑本地 DNSSEC 校验的运营方（AliDNS/DNSPod
# 单源旁路全部 fail-closed）；家庭出口实测国内视图更快（sina 469→31ms 等）。
# 裁定门槛与 A/alt 完全一致；BOGUS/裸空壳不采纳；非 CN 名不受影响。
# 回滚：删掉本行 + systemctl daemon-reload && systemctl restart dnsguard
Environment=GUARD_CN_DOMESTIC_PRIMARY=1

# ---- 快速透传（2026-10-20）----
# 动机：local-a 的裸 SERVFAIL 被归为 transport ⇒ 走 alt（unbound-alt，两家欧洲 DoT，
#       正常域名 p50=816ms、冷查询常 >15s）⇒ 真 SERVFAIL 域名每次白等 2.0s。
#       实测 ap-update-cdn-cloudflare-a2.haiteluo.com：unbound 990ms 已给结论，客户端 2006ms 才收到。
# 机制：local-a 判 transport 时，先问 aghcf（1.1.1.1 DoT，同域 SERVFAIL 实测 1~525ms）。
#       它**也明确回 rc=2** ⇒ 两家独立运营方都拒绝 ⇒ 立即透传，跳过 alt。
#       其它结果（有答案/超时/无应答）⇒ 原样退回原 alt 逻辑，与未启用时完全一致。
# 安全：只透传 SERVFAIL（不输出任何答案字节）；快速源必须给出**完整 rc=2 报文**才算数。
# 回滚：把 GUARD_FASTPASS 改为 0 并 daemon-reload + restart 即可（代码分支亦默认关闭）。
Environment=GUARD_FASTPASS=1
Environment=GUARD_FASTPASS_ADDR=127.0.0.1:5535
Environment=GUARD_FASTPASS_TIMEOUT=0.8
