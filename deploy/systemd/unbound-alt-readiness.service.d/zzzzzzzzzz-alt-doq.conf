[Service]
# 2026-10-25: readiness 探针改探 aghdq:5533（与 GUARD_ALT_ADDR 保持一致）
Environment=ALT_READY_PORT=5533
# 身份绑定的容器必须与**被探目标**同一个：门禁的 cid / StartedAt / pid_fp 全取自
# `docker inspect <container>`，而探针打的是 aghdq 的宿主端口。若沿用脚本默认值
# `unbound-alt`，就变成「探 aghdq、身份看 unbound-alt」——aghdq 重建时门禁不会失效，
# 门开着但后端已经换了进程（假 ready）；反过来 unbound-alt 重启又把门关上。
# docker inspect 查不到容器时脚本直接写 not-ready（identity_unavailable）⇒ 永久关闭，
# 所以这里的名字必须与 compose 的服务名逐字一致。
Environment=ALT_READY_CONTAINER=aghdq
