# 2026-10-19 修复 /var/log/chainmon.log 自 10-06 12:43 起停止写入。
#
# 根因：Python 3.6 在 stdout/stderr 重定向到文件时为**块缓冲**（line_buffering=False，
# 缓冲区 8192 字节）。systemd 用 StandardOutput=append: 把 fd 直接指向日志文件，
# 于是运行期的所有 print/stderr.write 都堆在 Python 进程内的内存缓冲里，只有
#   ① 单次缓冲写满 8KB 自动 flush，或 ② 进程正常退出（atexit flush）
# 才会落盘。而 chainmon 每次重启都是 systemd 发 SIGTERM 直接杀掉，
# Python 来不及 flush ⇒ 缓冲内容整块丢失。
#
# 实测（/usr/bin/python3 3.6.8）：
#   无 -u，输出 240B → 运行中 0 字节，SIGTERM 后 0 字节（全丢）
#   有 -u，输出 240B → 运行中 240 字节，SIGTERM 后 240 字节（保留）
#   无 -u，输出 16KB → 运行中 16428 字节（超 8KB 已自动 flush）
# 故 10-06 之前的 traceback 能落盘（每块约 1264 字节，累计超 8KB 触发 flush），
# 而单行的 "chainmon listening on ..." 永远只有几十字节，重启即丢失。
#
# 修复：加 -u（等价于 PYTHONUNBUFFERED=1），让 stdout/stderr 行缓冲、立即落盘。
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u /opt/chainmon/chainmon.py
