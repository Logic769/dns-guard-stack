# 2026-10-09：把 chainmon 的硬限抬到 384M（原 256M）。
# 背景：① 实测其历史峰值**恰好等于旧硬限** 256M，已多次撞顶被 OOM 杀；
#       ② 本次给看板新增了"AGH 累计计数差分"采集（多一次 API 调用 + 更大的 history），
#          256M 下会陷入"每 10 秒被杀一次"的重启循环，看板无法正常加载；
#       ③ 注意：`systemctl set-property` 写的是**临时** drop-in（/run），
#          `systemctl daemon-reload` 会把它丢掉 —— 本文件是**持久**配置，别再只依赖 set-property。
# MemorySwapMax 不在此设置：仍沿用 memory-swap.conf 的 0（禁止换出，防 2026-10-06 的换出卡顿事故）。
[Service]
MemoryHigh=320M
MemoryMax=384M
