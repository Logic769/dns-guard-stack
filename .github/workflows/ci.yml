name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 生产环境跑的是 Python 3.6，语法兼容必须单独验证（f-string、海象运算符等会在 3.6 下报错）
  syntax-py36:
    name: syntax (py3.6)
    runs-on: ubuntu-latest
    container: python:3.6-slim
    steps:
      - uses: actions/checkout@v4
      - name: compileall
        run: python -m compileall -q core tools probes firewall

  test:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: run tests
        run: |
          chmod +x tests/run.sh
          PYTHON=python tests/run.sh

  shell-check:
    name: shell & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
          done
          echo "bash syntax OK"
      - name: systemd unit dependencies
        run: python3 tests/check_units.py
      - name: public data guard
        run: python3 tools/check-public-data.py
