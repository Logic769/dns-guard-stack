<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>DNS 过滤 · 运行看板</title>
<style>
/* 公网免密只读页。设计约束（必须保留）：
   ① 零弹窗/零 toast/零淡出提示 —— 页面加载后不出现也不消失任何文本；
   ② 只编码真实信息 —— 响应里只有 8 个聚合字段，没有时间序列就不画趋势、不画环比、不画环形；
   ③ 颜色只作冗余通道，状态另有形状与文字双重编码；
   ④ 文字色一律用 *-text 暗档（填充档在白底不达 3:1）。
   视觉语言与两个内部看板统一：浅灰画布 + 纯白卡片 + 系统蓝 + SF 字体栈。 */
:root{
  --bg:#f5f5f7; --card:#ffffff; --card2:#f2f2f5; --track:#eeeef2; --line:#e3e3e8;
  --text:#1d1d1f; --text-2:#5c5c61; --text-3:#6e6e73;
  --ok-text:#248a3d; --warn-text:#9a5b00; --err-text:#c4261b;
  --accent:#0071e3;
  --r:20px;
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --track:#2c2c2e; --line:#38383a;
         --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#8e8e93;
         --ok-text:#30d158; --warn-text:#ffd60a; --err-text:#ff453a;
         --accent:#0a84ff;
         --shadow:0 1px 3px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
[hidden]{display:none !important}  /* 作者样式不能压过 hidden 属性（#boot/#main 靠它） */
html{min-height:100%}
body{margin:0;padding:24px 0;min-height:100vh;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
main{margin:auto;display:flex;flex-direction:column;gap:14px;width:min(430px,100vw - 32px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* —— 主卡：唯一的主角 —— */
.hero{padding:30px 22px 26px;text-align:center}
#label{font-size:13px;font-weight:500;color:var(--text-3);letter-spacing:.02em}
#hero{display:flex;align-items:baseline;justify-content:center;margin-top:10px}
#num{font-size:56px;font-weight:700;line-height:1.02;letter-spacing:-.022em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#unit{font-size:22px;font-weight:600;color:var(--text-2);margin-left:.18em;letter-spacing:-.01em}

/* —— 次指标：分母与占比。数字给精度，条形给量级 —— */
.subs{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.sub{padding:18px 20px}
.sub+.sub{border-left:1px solid var(--line)}
.sub .k{font-size:12px;color:var(--text-3)}
.sub .v{font-size:27px;font-weight:600;line-height:1.15;margin-top:4px;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#bar{height:7px;border-radius:4px;background:var(--track);margin-top:10px;overflow:hidden}
#bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.sub .d{font-size:12px;color:var(--text-3);margin-top:8px}

/* —— 状态卡：形状 + 文字 + 颜色 三重编码 —— */
.st{padding:16px 20px;display:flex;align-items:center;gap:12px}
.st .g{font-size:16px;line-height:1;width:20px;text-align:center;flex:0 0 20px}
.st .t{font-size:15px;font-weight:600;letter-spacing:-.005em}
.st .s{margin-left:auto;font-size:12.5px;color:var(--text-3);text-align:right}
.st.ok{color:var(--ok-text)} .st.warn{color:var(--warn-text)}
.st.err{color:var(--err-text)} .st.mute{color:var(--text-3)}
.st.ok .s,.st.warn .s,.st.err .s{color:var(--text-3)}

/* —— 骨架与失败态 —— */
#boot{color:var(--text-3);font-size:13px;display:flex;justify-content:center}
.sk{display:inline-block;background:var(--track);border-radius:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
body.fail .hero{border-style:dashed;border-color:var(--line)}
body.fail #num,body.fail #unit{color:var(--text-3)}

/* 窄屏：状态卡改成两行 —— 副行（证据级别说明）另起一行左对齐，
   否则标题与副行在同一行互挤，短句会被折成两段贴在图标旁边。 */
@media (max-width:639px){
  .st{align-items:flex-start;flex-wrap:wrap;padding:15px 18px}
  .st .g{margin-top:1px}
  .st .t{flex:1 1 auto;min-width:0}
  .st .s{margin-left:0;flex-basis:100%;text-align:left;padding-left:32px;margin-top:5px}
}
@media (max-width:360px){ #num{font-size:46px} .sub .v{font-size:22px} main{gap:10px} }
@media (min-width:640px){ main{width:min(520px,100vw - 48px)} #num{font-size:64px} }
@media (min-width:1024px){
  main{width:min(1080px,100vw - 72px);display:grid;grid-template-columns:1.18fr 1fr;
       grid-template-rows:auto auto auto;gap:16px;align-items:stretch}
  /* 四个子块必须全部显式定位，否则会落进隐式列把两列顶成三列。
     左列 hero 跨三行 = 右列三块总高；右列自上而下：次指标 / 链路 / 保护。 */
  .hero{grid-column:1;grid-row:1 / span 3;display:flex;flex-direction:column;justify-content:center;padding:48px 40px}
  .subs{grid-column:2;grid-row:1}
  #status{grid-column:2;grid-row:2;padding:20px 22px}
  #prot{grid-column:2;grid-row:3;padding:20px 22px}
  .sub{padding:22px 24px}
  #num{font-size:88px}
}
@media (min-width:1024px) and (max-width:1279px){
  /* 这个区间右列只有 ~429px，标题+副行挤在一行会断在词中间 → 副行整体下移一行 */
  .st{flex-wrap:wrap}
  .st .s{margin-left:0;flex-basis:100%;text-align:left;padding-left:32px;margin-top:2px}
}
@media (min-width:1440px){
  main{width:min(1200px,100vw - 96px);gap:20px}
  .hero{padding:56px 48px}
  .sub{padding:24px 28px}
  .sub .v{font-size:31px}
  .st{padding:22px 26px}
  #num{font-size:104px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<main id="main" hidden>
  <section class="card hero" id="heroCard">
    <div id="label">过去 24 小时拦截</div>
    <div id="hero"><span id="num">—</span><span id="unit"></span></div>
  </section>
  <section class="card subs">
    <div class="sub">
      <div class="k">24 小时查询</div>
      <div class="v" id="qv">—</div>
      <div class="d">全部协议合计</div>
    </div>
    <div class="sub">
      <div class="k">拦截占比</div>
      <div class="v" id="pv">—</div>
      <div id="bar"><i style="width:0%"></i></div>
      <div class="d">占全部查询</div>
    </div>
  </section>
  <section class="card st mute" id="status">
    <span class="g" id="statusg">•</span>
    <span class="t" id="statustext">—</span>
    <span class="s" id="statussub"></span>
  </section>
  <section class="card st mute" id="prot">
    <span class="g" id="protg">•</span>
    <span class="t" id="prottext">正在检查本设备的 DNS 保护状态</span>
    <span class="s" id="protsub"></span>
  </section>
</main>
<div id="boot"><span class="sk" style="width:186px;height:14px"></span></div>
<script>
"use strict";
(function(){
  var $ = function(id){ return document.getElementById(id); };

  /* 万/亿三档：中文零心算；三档最坏串宽统一 3.28em，320 屏不换行 */
  function fmt(n){
    n = Number(n) || 0;
    if (n >= 1e8) return { n:(n/1e8).toFixed(2), u:"亿" };
    if (n >= 1e4) { var w = n/1e4; return { n:(w >= 1000 ? Math.round(w).toLocaleString("en-US") : w.toFixed(1)), u:"万" }; }
    return { n:n.toLocaleString("en-US"), u:"" };
  }
  function exact(n){ return (Number(n)||0).toLocaleString("en-US"); }

  /* 状态：形状 + 文字 + 颜色三重编码；stale 是"不知道"，不是"出问题"，故走中性通道 */
  var ST = {
    ok:   { g:"✓", t:"链路正常" },
    warn: { g:"⚠", t:"链路降级" },
    err:  { g:"✕", t:"链路中断" }
  };
  var SUB = {
    ok:   "所有解析路径在线",
    warn: "部分路径可能滞后",
    err:  "有解析路径不可用",
    stale:"暂时读不到链路状态"
  };
  function paint(level, stale){
    var el = $("status");
    if (stale){ el.className = "card st mute"; $("statusg").textContent = "⊘"; $("statustext").textContent = "状态待确认"; $("statussub").textContent = SUB.stale; return; }
    var s = ST[level] || ST.warn;
    el.className = "card st " + (ST[level] ? level : "warn");
    $("statusg").textContent = s.g;
    $("statustext").textContent = s.t;
    $("statussub").textContent = SUB[level] || SUB.warn;
  }

  /* 保护判定：后台实测本设备是否在用本机的 DoT/DoH。
     两级证据由服务端给出，页面在副行如实标注证据级别，不把网络级说成设备级。
     所有文案都在"首帧就存在的固定槽位"里就地替换，绝不出现/消失 → 零弹窗。 */
  /* SNI 标记探针：请求 https://<随机token>.dns.example.com/…，ClientHello 里的 SNI
     在证书校验之前就发出（即使随后握手因证书不匹配而失败也没关系），抓包侧必然记录这一行。
     这是本架构下唯一能把"本次请求自己的 ja4"证明出来的通道 —— 也是把这次访问归因到某台设备的正解。 */
  var SNI_TOK = "";
  function sniProbe(){
    var a = "abcdefghijklmnopqrstuvwxyz0123456789", s = "z";
    for (var i = 0; i < 11; i++) s += a.charAt(Math.floor(Math.random() * a.length));
    SNI_TOK = s;
    try {
      /* 只需把 ClientHello 发出去（SNI 在证书校验前就在包里）；握手失败/404 都无所谓。
         注意 CSP：这条 origin 必须在 connect-src 里，否则请求在发起前就被浏览器拦掉。 */
      fetch("https://" + SNI_TOK + ".dns.example.com/p.gif?_=" + Date.now(), { mode:"no-cors", cache:"no-store" })
        .catch(function(){});
    } catch(e){}
  }

  /* 证据级别如实标注：sni-ja4=已证明是本次请求且指纹一致（设备级）；dns-now=此刻正在用；
     dns=同/本设备出口在运行（网络级）。probed 表示 SNI 标记已命中（出口 IP 已被证明是这台设备）。 */
  function ago(s){
    s = Number(s) || 0;
    if (s < 60) return s + " 秒前";
    if (s < 3600) return Math.round(s / 60) + " 分钟前";
    return Math.round(s / 3600) + " 小时前";
  }
  function protSub(d){
    var p = (d.proto === "dot") ? "DoT" : (d.proto === "doh" ? "DoH" : "加密 DNS");
    if (d.by === "sni-ja4") return "已确认本设备 · 加密 DNS 指纹一致";
    if (d.by === "dns-now") return p + " 正在使用中 · " + ago(d.age_s);
    if (d.by === "dns") return (d.probed ? "本设备出口的 " : "同出口的 ") + p + " 在运行 · " + ago(d.age_s);
    return "未观测到本机加密 DNS 活动";
  }
  function applyProt(d){
    var el = $("prot");
    if (!el || !d || typeof d.protected !== "boolean") return false;
    if (d.protected){
      el.className = "card st ok"; $("protg").textContent = "✓";
      $("prottext").textContent = "当前设备正在受到 DoT/DoH 保护";
      $("protsub").textContent = protSub(d);
    } else {
      el.className = "card st err"; $("protg").textContent = "✕";
      $("prottext").textContent = "该设备未受到保护";
      $("protsub").textContent = "未观测到本机加密 DNS 活动";
    }
    return true;
  }
  var CHK_TRY = 0, PROBED_AGAIN = false;
  function check(){
    fetch("/join/api/check?sni=" + SNI_TOK + "&_=" + Date.now(), {cache:"no-store", credentials:"same-origin"})
      .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
      .then(function(d){
        var el = $("prot");
        if (d && d.protected === true){
          el.className = "card st ok"; $("protg").textContent = "✓";
          $("prottext").textContent = "当前设备正在受到 DoT/DoH 保护";
          $("protsub").textContent = protSub(d);
          CHK_TRY = 9;
          /* 标记还没落行时再核一次：命中后副行会从"同出口"升级为"本设备出口"，只换文字不换行数 */
          if (d.probed !== true && !PROBED_AGAIN){ PROBED_AGAIN = true; if (TIMER) clearTimeout(TIMER); TIMER = setTimeout(check, 3500); }
        } else if (d && d.protected === false){
          el.className = "card st err"; $("protg").textContent = "✕";
          $("prottext").textContent = "该设备未受到保护";
          $("protsub").textContent = "未观测到本机加密 DNS 活动";
          /* 抓包侧可能还没解析到这次握手：最多再核两次，避免误报"未受保护" */
          CHK_TRY++;
          if (CHK_TRY <= 2) setTimeout(check, 4000 * CHK_TRY);
        } else { throw new Error("shape"); }
      })
      .catch(function(){
        var el = $("prot");
        el.className = "card st mute"; $("protg").textContent = "⊘";
        $("prottext").textContent = "保护状态暂无法确认";
        $("protsub").textContent = "稍后自动重试";
        CHK_TRY++;
        if (CHK_TRY <= 2) setTimeout(check, 5000 * CHK_TRY);
      });
  }

  var RETRY = 0, TIMER = null, SOFT_RETRY = false;
  function fail(){
    document.body.classList.add("fail");
    $("boot").hidden = true; $("main").hidden = false;
    $("num").textContent = "—"; $("unit").textContent = "";
    $("qv").textContent = "—"; $("pv").textContent = "—";
    $("bar").firstChild.style.width = "0%";
    paint(null, true);
    /* 退避自动重试：无按钮、无弹窗，页面自己恢复 */
    RETRY++;
    if (TIMER) clearTimeout(TIMER);
    TIMER = setTimeout(load, Math.min(60000, 5000 * Math.pow(2, Math.min(RETRY - 1, 4))));
  }
  function load(){
    fetch("/join/api/status", {cache:"no-store", credentials:"same-origin"})
      .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
      .then(function(d){
        if (!d || typeof d.blocked24h !== "number" || typeof d.queries24h !== "number") throw new Error("shape");
        RETRY = 0;
        document.body.classList.remove("fail");
        var f = fmt(d.blocked24h);
        $("boot").hidden = true; $("main").hidden = false;
        $("num").textContent = f.n;
        $("unit").textContent = f.u ? f.u + "次" : "次";
        $("qv").textContent = exact(d.queries24h);
        var pct = typeof d.blockedPct === "number" ? d.blockedPct : 0;
        $("pv").textContent = pct.toFixed(1) + "%";
        $("bar").firstChild.style.width = Math.max(0, Math.min(100, pct)) + "%";
        paint(d.chain_level, d.stale === true);
        /* 详情过期（stale）时只做一次自愈重取：不是弹窗、不是提示，就是再问一次 */
        if (d.stale === true && !SOFT_RETRY){ SOFT_RETRY = true; if (TIMER) clearTimeout(TIMER); TIMER = setTimeout(load, 8000); }
      })
      .catch(fail);
  }

  /* ============ 2026-10-15 全量指纹采集 + 持久 ID ============
     目标（用户要求）：打开这一页就自动完成，不需要用户做任何操作，尽量留最多的信息。
     分两类：
       ① 持久 ID 四通道（localStorage / IndexedDB / Cookie / Cache API）—— 抗"只清 Cookie"或"只清缓存"，
          也供设备看板判断"是不是同一台设备"（同一浏览器跨会话、跨出口 IP 变化仍能认出）；
       ② 深度指纹（fp2）—— 屏幕/时区/编解码/存储/WebGL/Canvas/Audio/字体/权限/WebRTC 主机候选/UA-CH 高熵。
     文本与网络侧指纹（JA4、TCP 签名、SNI 标记）由抓包侧给出，客户端自称一律不作数。 */
  function rid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function lsId(){
    try{ var k = "dvn", v = localStorage.getItem(k);
      if (!v){ v = rid(); localStorage.setItem(k, v); }
      return v;
    }catch(e){ return null; }
  }
  function ckId(){
    try{
      var m = /(^|;\s*)dvnid=([^;]+)/.exec(document.cookie);
      if (m) return m[2];
      var v = rid();
      document.cookie = "dvnid=" + v + "; max-age=31536000; path=/; SameSite=Lax";
      return v;
    }catch(e){ return null; }
  }
  function idbId(cb){
    try{
      var rq = indexedDB.open("dvn", 1);
      rq.onupgradeneeded = function(){ try{ rq.result.createObjectStore("k"); }catch(e){} };
      rq.onerror = function(){ cb(null); };
      rq.onsuccess = function(){
        try{
          var st = rq.result.transaction("k", "readwrite").objectStore("k"), g = st.get("id");
          g.onerror = function(){ cb(null); };
          g.onsuccess = function(){
            var v = g.result;
            if (!v){ v = rid(); try{ st.put(v, "id"); }catch(e){} }
            cb(v);
          };
        }catch(e){ cb(null); }
      };
    }catch(e){ cb(null); }
  }
  function cacheId(cb){
    try{
      if (!window.caches){ cb(null); return; }
      caches.open("dvn").then(function(c){
        return c.match("/dvn-id").then(function(r){
          if (r) return r.text();
          var v = rid();
          return c.put("/dvn-id", new Response(v)).then(function(){ return v; }).catch(function(){ return v; });
        });
      }).then(cb).catch(function(){ cb(null); });
    }catch(e){ cb(null); }
  }

  /* FNV-1a 双 32 位拼 64 位：只用于"稳定子集"的等值比较，不做安全用途 */
  function fnv(s){
    var h1 = 0x811c9dc5, h2 = 0x5bd1e995;
    for (var i = 0; i < s.length; i++){
      var c = s.charCodeAt(i);
      h1 = ((h1 ^ c) * 0x01000193) >>> 0;
      h2 = ((h2 ^ c) * 0x85ebca6b) >>> 0;
      h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0;
    }
    return ("00000000" + h1.toString(16)).slice(-8) + ("00000000" + h2.toString(16)).slice(-8);
  }

  function base(){
    var n = navigator, s = screen, fp = {
      screen: s.width + "x" + s.height + "@" + (window.devicePixelRatio || 1),
      tz: (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return null; } })(),
      lang: (n.languages || []).join(","), cores: n.hardwareConcurrency,
      mem: n.deviceMemory, touch: n.maxTouchPoints, plat: n.platform
    };
    try{
      var c = document.createElement("canvas"); c.width = 240; c.height = 60;
      var g = c.getContext("2d"); g.textBaseline = "top"; g.font = "14px Arial";
      g.fillStyle = "#f60"; g.fillRect(0,0,120,30); g.fillStyle = "#069"; g.fillText("d",2,15);
      fp.cv = c.toDataURL().slice(-32);
    }catch(e){}
    try{
      var gl = document.createElement("canvas").getContext("webgl");
      if (gl){ var dbg = gl.getExtension("WEBGL_debug_renderer_info");
        fp.gl = String(dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)).slice(0,60); }
    }catch(e){}
    return fp;
  }

  /* —— 深度指纹：同步部分 —— */
  function deepSync(){
    var o = {}, n = navigator, s = screen;

              arch:h.architecture, bit:h.bitness, ff:h.formFactors, fvl:h.fullVersionList,
              model:h.model, pver:h.platformVersion, uafv:h.uaFullVersion, wow:h.wow64 });
          }).catch(function(){ res(null); });
        setTimeout(function(){ res(null); }, 900);
      }catch(e){ res(null); }
    });
  }
  /* 稳定子集：只挑"同一台设备、同一浏览器多次访问应保持一致"的字段做 hash（用于跨会话归并）。
     2026-10-15 修正：canvas（cv）与 AudioContext（audio）在无头/虚拟化/降级渲染环境下会抖动
     —— 实测同机两次访问 hash 就变了。它们仍完整保存在 fp2 里当强指纹参考，但不参与这个 hash；
     跨会话归并的主键是 pids 的四个持久 ID + 该 hash。 */
  /* —— 四层归类 schema（v3，2026-10-25）——
     采集项攒到 39 个之后，"一堆平铺的键"本身已经看不懂了。这里给每个键定一个层，
     层的划分依据只有一条：**这个值会不会随时间/网络/电量变化**。
       L1 身份：同一台设备重复访问应完全一致，是跨会话归并的主键来源
       L2 硬件：由设备本身决定，但可能因外设插拔、内存压力浮动
       L3 软件栈：由浏览器/扩展版本决定，升级就变
       L4 运行时：每次访问都不同，只用于观测，绝不参与归并
     未登记的新键不会被塞进任何一层，会落进 _meta.cls.un，提醒维护者补表。 */
  var CLS = {
    l1: ["uach","screen2","tz2","gpu","gl2","fonts","fonts2","math","metric","emoji","kbd","cv","audioSig"],
    l2: ["hints","audioEnv","wgpu","raf","quota","scroll","dev"],
    l3: ["jsf","feat","feat2","intl","chr","err","speech","perm","media","rec","mcap","store","isExt"],
    l4: ["clock","perf","env2","env3","bat","rtc"]
  };
  /* 稳定子集：只有这些字段的两条记录才允许被判定为"同一台设备"。
     注意 cv / audioSig / math 虽然归在 L1，但因为实测会抖动，这里不列，不参与 hash。 */
  var STAB = ["gpu","fonts","uach","screen2","tz2","media","hints"];
  /* 归并 hash 的分段投影。输出串与 2026-10-15 版逐字节一致，不改既有设备的 hash_stable。 */
  var SEG = [
    ["gpu", function(o){ return (o.gpu && (o.gpu.v + "|" + o.gpu.r + "|" + o.gpu.mts)) || ""; }],
    ["fonts", function(o){ return (o.fonts || []).join(","); }],
    ["uach", function(o){ return (o.uach && (o.uach.arch + "|" + o.uach.bit + "|" + o.uach.model + "|" + o.uach.pver)) || ""; }],
    ["screen2", function(o){ return (o.screen2 && (o.screen2.w + "x" + o.screen2.h + "x" + o.screen2.cd + "x" + o.screen2.dpr)) || ""; }],
    ["tz2n", function(o){ return (o.tz2 && o.tz2.n) || ""; }],
    ["tz2cal", function(o){ return (o.tz2 && o.tz2.cal) || ""; }],
    ["media", function(o){ return (o.media ? JSON.stringify(o.media) : ""); }],
    ["maxTouch", function(o){ return (o.hints && o.hints.maxTouch) || 0; }],
    ["hc", function(o){ return (o.hints && o.hints.hc) || 0; }]
  ];
  function stableOf(o){
    try{
      var out = [], i;
      for (i = 0; i < SEG.length; i++) out.push(SEG[i][1](o));
      return out.join("#");
    }catch(e){ return ""; }
  }
  /* 把实际存在的键按层打包，得到 {l1:[…],l2:[…],l3:[…],l4:[…],un:[…]}。
     只有真的采到的键才写进去 —— 缺项本身就是信息（探针超时/设备不支持），不补空占位。 */
  function packCls(o){
    var m = {}, p = {}, k, L, i;
    for (L in CLS) for (i = 0; i < CLS[L].length; i++) m[CLS[L][i]] = L;
    for (k in o){
      if (k === "_meta") continue;
      L = m[k] || "un";
      if (!p[L]) p[L] = [];
      p[L].push(k);
    }
    return p;
  }
/* —— 2026-10-25 扩展的异步探针（每项自带超时兜底，最慢 900ms） —— */
  function pBat(){
    return new Promise(function(res){
      try{
        if (!navigator.getBattery){ res(null); return; }
        navigator.getBattery().then(function(b){
          res({ lv:Math.round((b.level || 0) * 1000) / 1000, ch:b.charging,
            ct:(b.chargingTime === Infinity ? -1 : b.chargingTime), dt:(b.dischargingTime === Infinity ? -1 : b.dischargingTime) });
        }).catch(function(){ res(null); });
        setTimeout(function(){ res(null); }, 700);
      }catch(e){ res(null); }
    });
  }
  function pDev(){
    return new Promise(function(res){
      try{
        if (!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)){ res(null); return; }
        navigator.mediaDevices.enumerateDevices().then(function(ds){
          var c = { audioinput:0, audiooutput:0, videoinput:0, other:0 };
          for (var i = 0; i < ds.length; i++){ var k2 = ds[i].kind || "other"; c[k2] = (c[k2] || 0) + 1; }
          res(c);
        }).catch(function(){ res(null); });
        setTimeout(function(){ res(null); }, 800);
      }catch(e){ res(null); }
    });
  }
  function pPerf(){
    return new Promise(function(res){
      try{
        var out = {};
        try{ var m = performance.memory; if (m) out.heap = { lim:m.jsHeapSizeLimit, tot:m.totalJSHeapSize }; }catch(e){}
        try{
          var nav2 = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
          if (nav2) out.nav = { dns:Math.round(nav2.domainLookupEnd - nav2.domainLookupStart),
            tcp:Math.round(nav2.connectEnd - nav2.connectStart),
            tls:(nav2.secureConnectionStart ? Math.round(nav2.connectEnd - nav2.secureConnectionStart) : null),
            ttfb:Math.round(nav2.responseStart - nav2.requestStart) };
        }catch(e){}
        try{ if (navigator.connection && navigator.connection.type) out.ntype = navigator.connection.type; }catch(e){}
        res(out);
      }catch(e){ res(null); }
    });
  }
  function pWgpu(){
    return new Promise(function(res){
      try{
        if (!(navigator.gpu && navigator.gpu.requestAdapter)){ res(null); return; }
        navigator.gpu.requestAdapter().then(function(a){
          if (!a){ res(null); return; }
          var info = null;
          try{ if (a.info) info = { v:a.info.vendor, a:a.info.architecture, d:a.info.device, desc:(a.info.description || "").slice(0,60) }; }catch(e){}
          res({ info:info, nf:(a.features && a.features.size != null ? a.features.size : null) });
        }).catch(function(){ res(null); });
        setTimeout(function(){ res(null); }, 900);
      }catch(e){ res(null); }
    });
  }
  function pMedia2(){
    return new Promise(function(res){
      try{
        if (!(navigator.mediaCapabilities && navigator.mediaCapabilities.decodingInfo)){ res(null); return; }
        navigator.mediaCapabilities.decodingInfo({ type:"file", video:{
          contentType:'video/mp4; codecs="avc1.640028"', width:1920, height:1080, bitrate:8000000, framerate:30 } })
          .then(function(r){ res({ smooth:r.smooth, power:r.powerEfficient }); }).catch(function(){ res(null); });
        setTimeout(function(){ res(null); }, 700);
      }catch(e){ res(null); }
    });
  }
  /* 刷新率与掉帧：高刷屏 120/144Hz 与常规 60Hz 在触屏设备上区分度很高 */
  function pRaf(){
    return new Promise(function(res){
      try{
        if (!window.requestAnimationFrame){ res(null); return; }
        var ts = [], t0 = 0, sent = false;
        function fin(v){ if (!sent){ sent = true; res(v); } }
        function step(t){
          if (!t0) t0 = t;
          ts.push(t);
          if (ts.length < 21){ requestAnimationFrame(step); return; }
          var ds = [];
          for (var i = 1; i < ts.length; i++) ds.push(ts[i] - ts[i - 1]);
          ds.sort(function(a, b){ return a - b; });
          var med = ds[Math.floor(ds.length / 2)];
          fin({ hz: med > 0 ? Math.round(1000 / med) : null, med: Math.round(med * 100) / 100,
            n: ds.length, dur: Math.round(ts[ts.length - 1] - t0) });
        }
        requestAnimationFrame(step);
        setTimeout(function(){ fin(null); }, 1100);
      }catch(e){ res(null); }
    });
  }
  /* 语音合成引擎与语音包：直接暴露系统语言包集合（Windows/macOS/Android 差异极大） */
  function pSpeech(){
    return new Promise(function(res){
      try{
        if (!window.speechSynthesis){ res(null); return; }
        function grab(){
          var vs = [];
          try{ vs = speechSynthesis.getVoices() || []; }catch(e){}
          if (!vs.length) return null;
          var out = [];
          for (var i = 0; i < vs.length && i < 8; i++) out.push((vs[i].name || "") + "/" + (vs[i].lang || ""));
          return { n: vs.length, v: out };
        }
        var r0 = grab();
        if (r0){ res(r0); return; }
        try{ speechSynthesis.onvoiceschanged = function(){ var r1 = grab(); if (r1) res(r1); }; }catch(e){}
        setTimeout(function(){ res(grab()); }, 900);
      }catch(e){ res(null); }
    });
  }
  /* 探针状态记录（2026-10-25 修复"缺元信息"）。
     原实现里 null 同时表示"设备压根不支持"和"探针等到超时都没结果"，两者混为一谈，
     下游无法判断到底是设备没有该能力、还是页面在这一项上没跑完。
     这里按每个探针自己的超时阈值反推：用了 >= 阈值-80ms 才返回 null ⇒ 判为 timeout，
     明显早于阈值就返回 null ⇒ 判为 unsupported（探针探测到 API 不存在后立刻返回）。 */
  var PROBE_T = { audioSig:900, rtc:1200, perm:800, quota:700, uach:900, bat:700, dev:800,
    perf:1600, wgpu:900, mcap:700, raf:1100, speech:900 };
  function pDeep(){
    var o = deepSync(), st = {}, t0 = Date.now();
    function pick(name, mk){
      var s = Date.now();
      return mk().then(function(v){
        var el = Date.now() - s, lim = PROBE_T[name] || 900;
        st[name] = (v === null || (Array.isArray(v) && v.length === 0 && name === "rtc"))
          ? (el >= lim - 80 ? "timeout" : "unsupported") : "ok";
        o[name] = v;
        return v;
      }, function(){ st[name] = "error"; o[name] = null; return null; });
    }
    return Promise.all([ pick("audioSig", pAudio), pick("rtc", pRtc), pick("perm", pPerm),
                         pick("quota", pQuot), pick("uach", pUach),
                         pick("bat", pBat), pick("dev", pDev), pick("perf", pPerf),
                         pick("wgpu", pWgpu), pick("mcap", pMedia2),
                         pick("raf", pRaf), pick("speech", pSpeech) ])
      .then(function(){
        /* 元信息：schema 版本 + 采集耗时 + 各探针结局。体积约 300 字节，远低于 fp2 上限。 */
        o._meta = { v:3, ts:Date.now(), ms:(Date.now() - t0), probes:st,
          cls:packCls(o), stab:STAB };
        return o;
      })
      .catch(function(){
        o._meta = { v:3, ts:Date.now(), ms:(Date.now() - t0), probes:st, err:1,
          cls:packCls(o), stab:STAB };
        return o;
      });
  }

  /* 零输入自动登记：静默进行，绝不提示、不弹窗、不淡出；失败也不影响上面任何数字。
     2026-10-15：登记体扩展为 fp(基础) + fp2(深度) + pids(四通道持久 ID) + hs(稳定子集 hash) + ua_full，
     并带 SNI 标记，使服务端能把"本次请求自己的 JA4"归因到这台设备（归因不再只靠聚合指纹）。 */
  function withTimeout(p, ms, dflt){
    return Promise.race([ p, new Promise(function(res){ setTimeout(function(){ res(dflt); }, ms); }) ]);
  }
  function register(){
    var hi = pUach().then(function(v){ return v || {}; }).catch(function(){ return {}; });
    Promise.all([
      /* 1500ms：IndexedDB/Cache API 是真实 I/O，不受页面虚拟时间影响，慢设备/冷启动要留足 */
      withTimeout(new Promise(function(r){ idbId(r); }), 1500, null),
      withTimeout(new Promise(function(r){ cacheId(r); }), 1500, null),
      withTimeout(pDeep(), 1600, {}),
      withTimeout(hi, 1200, {})
    ]).then(function(a){
      var ids = { ls:lsId(), idb:a[0], ck:ckId(), ca:a[1] };
      var fp2 = a[2] || {}, h = a[3] || {};
      if (fp2.uach === undefined && h.arch !== undefined) fp2.uach = h;
      var body = {
        k: ids.ls || "anon", sni: SNI_TOK,
        fp: base(), fp2: fp2, pids: ids, hs: fnv(stableOf(fp2)),
        ua_full: String(navigator.userAgent || "").slice(0, 400),
        model: h.model || "", platform: h.plat || h.platform || "",
        platform_ver: h.pver || h.platformVersion || "", arch: h.arch || h.architecture || ""
      };
      return fetch("/join/api/register", { method:"POST", credentials:"same-origin",
        headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        /* 登记响应里就带当次 DoT/DoH 判定 ⇒ 页面无需等第二次往返即可显示结论 */
        if (d && typeof d.protected === "boolean") applyProt(d);
      })
      .catch(function(){});
  }

  sniProbe();                 /* 先发标记请求：让抓包侧有时间把这一行落盘 */
  load();
  setTimeout(register, 700);  /* 登记要带上 sni，所以等标记行先出现 */
  setTimeout(check, 2200);
})();
</script>
